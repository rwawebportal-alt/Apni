<!doctype html>
<html lang="hi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Aapni Padhai Pro Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col bg-slate-50">

    <nav id="topHeaderNav" class="sky-nav sticky top-0 z-40 px-4 py-3 shadow-md bg-white">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="showSlide('slideHome')">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white font-black text-xl">A</div>
                <div><div class="font-extrabold text-lg text-slate-900">AAPNI PADHAI PORTAL</div></div>
            </div>
            <button onclick="renderPaidBatches()" class="btn-nav bg-indigo-600 text-white">📚 My Courses</button>
        </div>
    </nav>

    <main class="max-w-7xl w-full mx-auto p-4 flex-1">
        <!-- SLIDE 1: HOME -->
        <section id="slideHome" class="slide-page active-slide">
            <div class="text-center mt-6 mb-8">
                <h1 class="text-3xl font-black text-slate-900">Aapni Padhai Web Portal</h1>
                <p class="text-slate-600 mt-2 font-medium">Access your Rajasthan Police & Other batches seamlessly.</p>
            </div>
            <div class="max-w-md mx-auto">
                <button onclick="renderPaidBatches()" class="w-full btn-watch py-4 text-lg">Load My Purchased Courses ➔</button>
            </div>
        </section>

        <!-- SLIDE 2: EXPLORER (FOLDERS) -->
        <section id="slideExplorer" class="slide-page hidden-slide">
            <div class="flex items-center gap-4 mb-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <button onclick="handleGlobalBack()" class="btn-nav bg-slate-800 text-white">⬅ Back</button>
                <h2 id="headingText" class="text-xl font-black text-slate-900">Explorer</h2>
            </div>
            <div id="mainGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
        </section>

        <!-- SLIDE 3: PLAYER -->
        <section id="slidePlayer" class="slide-page hidden-slide">
            <div class="max-w-5xl mx-auto bg-slate-900 rounded-3xl overflow-hidden shadow-2xl border-4 border-slate-800">
                <div class="flex justify-between items-center p-4 bg-black border-b border-slate-700">
                    <h3 id="playingTitle" class="font-black text-white truncate">▶ Video Player</h3>
                    <button onclick="handleGlobalBack()" class="btn-nav bg-rose-600 text-white text-xs">✖ Close</button>
                </div>
                <div id="hlsScreen" class="relative w-full aspect-video bg-black">
                    <video id="video" playsinline class="w-full h-full object-contain"></video>
                    <div id="playerControlsBar" class="absolute bottom-0 w-full p-4 bg-gradient-to-t from-black/80 to-transparent transition-opacity">
                        <input id="seek" type="range" min="0" max="1000" value="0" class="w-full accent-blue-500 mb-2 cursor-pointer">
                        <div class="flex justify-between items-center text-white">
                            <div class="flex gap-4">
                                <button id="toggle" class="text-2xl hover:scale-110">⏸</button>
                                <span id="time" class="text-xs font-mono font-bold mt-1">00:00 / 00:00</span>
                            </div>
                            <button id="fs" class="text-xl hover:scale-110">⛶</button>
                        </div>
                    </div>
                </div>
                <input id="url" type="hidden">
            </div>
            <div class="max-w-5xl mx-auto mt-6">
                <h4 class="font-black text-lg text-slate-900 mb-3">⏭️ Up Next</h4>
                <div id="nextClassesGrid" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>
            </div>
        </section>

        <!-- SLIDE 4: PDF -->
        <section id="slidePdf" class="slide-page hidden-slide">
            <div class="bg-white p-4 rounded-2xl shadow">
                <div class="flex justify-between items-center mb-3">
                    <h3 id="pdfTitle" class="font-extrabold text-slate-900 truncate">📄 Notes</h3>
                    <button onclick="handleGlobalBack()" class="btn-nav bg-rose-600 text-white text-xs">✖ Close</button>
                </div>
                <iframe id="pdfFrame" class="w-full h-[82vh] rounded-xl border-2 border-slate-200" src=""></iframe>
            </div>
        </section>
    </main>

    <script src="player.js"></script>
    <script src="app.js"></script>
</body>
</html>
